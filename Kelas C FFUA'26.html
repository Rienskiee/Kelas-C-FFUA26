<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelas C FFUA'26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Poppins:ital,wght@0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2d5c; --gold:#fcc419; --bg:#f7f8fa; --card:#ffffff; --title:#0f2d5c;
  --muted:#8a94a6; --row:#eef1f6; --row-gold:#fff8e1; --icon-bg:#e0e5ee; --icon-gold:#ffe9a8;
  --line:rgba(15,45,92,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1424; --card:#12203a; --title:#ffffff; --muted:#93a0b8; --row:#1a2b4a; --row-gold:#2a2a1a;
    --icon-bg:#27406b; --icon-gold:#4a4020; --line:rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1424; --card:#12203a; --title:#ffffff; --muted:#93a0b8; --row:#1a2b4a; --row-gold:#2a2a1a;
  --icon-bg:#27406b; --icon-gold:#4a4020; --line:rgba(255,255,255,.08);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--title);font-family:'Poppins',system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:space-between;padding:14px 22px;box-shadow:0 6px 18px rgba(15,45,92,.25)}
.brand{display:flex;align-items:center;gap:14px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;letter-spacing:.06em;color:#fff;text-decoration:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px}
.burger{background:none;border:0;color:#fff;padding:8px;cursor:pointer;border-radius:8px}
.burger:focus-visible,.course-head:focus-visible,.link:focus-visible,.menu a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.menu{position:absolute;right:16px;top:100%;margin-top:8px;background:var(--card);border-radius:14px;padding:8px;min-width:190px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);display:none}
.menu.open{display:block}
.menu a{display:block;padding:12px 14px;border-radius:10px;color:var(--title);text-decoration:none;font-weight:600;font-size:15px}
.menu a:hover{background:var(--row)}
.hero{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px;position:relative}
.hero h1{margin:0;font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(44px,13vw,84px);line-height:1.05;letter-spacing:-.01em}
.hero h1 span{color:var(--gold);display:block}
.hero p{margin:22px 0 0;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:500;line-height:1.9}
.divider{height:5px;background:linear-gradient(90deg,var(--navy),var(--gold) 50%,var(--navy))}
.quick{max-width:640px;margin:0 auto;padding:72px 20px 96px;text-align:center}
.eyebrow{margin:0;color:var(--gold);font-weight:600;font-size:14px;letter-spacing:.35em;text-transform:uppercase}
.quick h2{margin:10px 0 8px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(34px,9vw,48px);letter-spacing:-.01em}
.quick h2 span{color:var(--gold)}
.sub{margin:0 0 44px;color:var(--muted);font-size:16px}
.course{background:var(--card);border-radius:28px;box-shadow:0 4px 18px var(--line);margin-bottom:18px;text-align:left;overflow:hidden}
.course-head{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:20px;padding:22px 28px;cursor:pointer;border-radius:28px}
.ico{flex:none;width:56px;height:56px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(15,45,92,.25)}
.ico svg{width:26px;height:26px}
.course-head b{flex:1;font-family:'Montserrat',sans-serif;font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.chev{width:22px;height:22px;color:var(--muted);transition:transform .25s}
.course.open .chev{transform:rotate(180deg)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.course.open .panel{grid-template-rows:1fr}
.panel-in{overflow:hidden}
.panel-pad{padding:0 28px 24px;display:grid;gap:12px}
.link{display:flex;align-items:center;gap:18px;padding:16px 18px;border-radius:20px;background:var(--row);color:var(--title);text-decoration:none;font-weight:600;font-size:16px;letter-spacing:.02em;text-transform:uppercase}
.link.gold{background:var(--row-gold)}
.link .lic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--icon-bg);display:grid;place-items:center}
.link.gold .lic{background:var(--icon-gold)}
.link .lic svg{width:22px;height:22px}
.link span{flex:1}
.link .ext{width:20px;height:20px;color:var(--muted);flex:none}
.link:hover{filter:brightness(.97)}
footer.divider{margin-top:0}
@media (prefers-reduced-motion:reduce){.panel,.chev{transition:none}html{scroll-behavior:auto}}
@media (max-width:420px){.course-head{padding:18px 20px;gap:16px}.panel-pad{padding:0 18px 20px}.course-head b{font-size:17px}}
</style>
</head>
<body>

<header>
  <a class="brand" href="#top"><span class="logo" aria-hidden="true">C</span>KELAS C FFUA'26</a>
  <button class="burger" id="burger" aria-label="Buka menu" aria-expanded="false">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="menu" id="menu"><a href="#top">Beranda</a><a href="#matkul">Mata kuliah</a></nav>
</header>

<section class="hero" id="top">
  <h1>Kelas C<span>FFUA'26</span></h1>
  <p>Fakultas Farmasi<br>Universitas Airlangga</p>
</section>
<div class="divider"></div>

<main class="quick" id="matkul">
  <p class="eyebrow">Akses cepat</p>
  <h2>MATA <span>KULIAH</span></h2>
  <p class="sub">Klik untuk mengakses materi dan penugasan</p>
  <div id="list"></div>
</main>
<div class="divider"></div>

<script>
/* ISI LINK GDRIVE DI SINI: ganti "#" dengan link masing-masing */
const MATKUL = [
  {nama:"Kimdas Teori",        ikon:"book",   materi:"#", tugas:"#"},
  {nama:"Kimdasprak",          ikon:"flask",  materi:"#", tugas:"#"},
  {nama:"Botani Teori",        ikon:"leaf",   materi:"#", tugas:"#"},
  {nama:"Botani Praktikum",    ikon:"sprout", materi:"#", tugas:"#"},
  {nama:"Fundamental Farmasi", ikon:"pill",   materi:"#", tugas:"#"},
  {nama:"Bioselmol",           ikon:"dna",    materi:"#", tugas:"#"}
];

const S = (d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IKON = {
  book:  S('<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>'),
  flask: S('<path d="M10 2v7.5L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 9.5V2"/><path d="M8.5 2h7M7 16h10"/>'),
  leaf:  S('<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.5 6-8"/>'),
  sprout:S('<path d="M7 20h10M12 20v-9"/><path d="M12 11c0-3-2-5-6-5 0 3 2 5 6 5z"/><path d="M12 13c0-3 2-5 6-5 0 3-2 5-6 5z"/>'),
  pill:  S('<path d="m10.5 20.5 10-10a4.95 4.95 0 0 0-7-7l-10 10a4.95 4.95 0 0 0 7 7z"/><path d="m8.5 8.5 7 7"/>'),
  dna:   S('<path d="M7 3c0 6 10 6 10 9s-10 3-10 9"/><path d="M17 3c0 6-10 6-10 9s10 3 10 9"/><path d="M9 6h6M9 18h6"/>')
};
const FOLDER = S('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>');
const FILE   = S('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>');
const EXT    = '<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>';
const CHEV   = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

const list = document.getElementById('list');
list.innerHTML = MATKUL.map((m,i)=>`
  <div class="course" id="c${i}">
    <button class="course-head" aria-expanded="false" aria-controls="p${i}" data-i="${i}">
      <span class="ico">${IKON[m.ikon]}</span><b>${m.nama}</b>${CHEV}
    </button>
    <div class="panel" id="p${i}"><div class="panel-in"><div class="panel-pad">
      <a class="link" href="${m.materi}" target="_blank" rel="noopener"><span class="lic">${FOLDER}</span><span>Materi</span>${EXT}</a>
      <a class="link gold" href="${m.tugas}" target="_blank" rel="noopener"><span class="lic">${FILE}</span><span>Penugasan</span>${EXT}</a>
    </div></div></div>
  </div>`).join('');

list.addEventListener('click',e=>{
  const link=e.target.closest('a.link');
  if(link && link.getAttribute('href')==='#'){e.preventDefault();return;}
  const btn=e.target.closest('.course-head'); if(!btn) return;
  const card=btn.parentElement, willOpen=!card.classList.contains('open');
  list.querySelectorAll('.course').forEach(c=>{c.classList.remove('open');c.querySelector('.course-head').setAttribute('aria-expanded','false');});
  if(willOpen){card.classList.add('open');btn.setAttribute('aria-expanded','true');}
});

const burger=document.getElementById('burger'), menu=document.getElementById('menu');
burger.addEventListener('click',()=>{const o=menu.classList.toggle('open');burger.setAttribute('aria-expanded',o);});
menu.addEventListener('click',()=>{menu.classList.remove('open');burger.setAttribute('aria-expanded','false');});
</script>
</body>
</html>
